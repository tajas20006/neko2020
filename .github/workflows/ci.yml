name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install tkinter
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check neko2020/ tests/

      - name: Pytest
        run: uv run --with pytest-cov pytest --cov=neko2020 --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
