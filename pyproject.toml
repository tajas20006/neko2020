[project]
name = "neko2020"
version = "0.3.1"
description = "Cross-Platform oneko implementation with python"
authors = [{ name = "Yoshioka Shun", email = "tajas2006@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "pystray>=0.19.5",
    "pillow>=13.0.0",
]

[project.urls]
Repository = "https://github.com/tajas20006/neko2020"

[project.optional-dependencies]
imgen = [
    "accelerate>=1.15.0",
    "diffusers>=0.42.0",
    "ollama>=0.6.3",
    "rembg[cpu]>=2.0.86",
    "safetensors>=0.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.20.2",
]
imgen-gpt = [
    "openai>=3.37.0",
    "rembg[cpu]>=2.0.86",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "pyinstaller>=6.22.3",
    "pywin32-ctypes>=0.2.3 ; sys_platform == 'win32'",
    "pywin32>=312 ; sys_platform == 'win32'",
    "pre-commit>=4.7.0",
    "pefile>=2024.8.26",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
